name: Daily Skill Harvest

on:
  schedule:
    - cron: "17 3 * * *" # daily 03:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: skill-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect skills
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/collect.py

      - name: Commit updated library
        run: |
          git config user.name "bug-bounty-skills-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes since last run."
          else
            git commit -m "harvest: $(date -u '+%Y-%m-%d') — refresh merged library"
            git push
          fi
